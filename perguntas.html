<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scanner Facial - Espelho do Futuro</title>

<style>

/* =========================================
   CONFIGURAÇÕES GERAIS
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#050816,#081B33,#0B2447);
    color:white;
    padding:20px;
}

.container{
    width:90%;
    max-width:650px;
    text-align:center;
}

/* =========================================
   TÍTULO
========================================= */

h1{
    color:#65d6ff;
    margin-bottom:10px;
    font-size:32px;
    text-shadow:0 0 15px #00B7FF55;
}

.subtitulo{
    opacity:.7;
    margin-bottom:25px;
    line-height:1.5;
}

/* =========================================
   ÁREA DA CÂMERA
========================================= */

.camera-box{
    position:relative;
    width:100%;
    aspect-ratio:4/3;
    background:#000;
    border-radius:25px;
    overflow:hidden;
    border:2px solid #00B7FF;

    box-shadow:
        0 0 20px #00B7FF55,
        0 0 60px #00B7FF22;
}

#video{
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
}

/* =========================================
   EFEITO SCANNER
========================================= */

.scanner{
    position:absolute;
    width:100%;
    height:3px;
    left:0;
    top:0;

    background:#00B7FF;

    box-shadow:
        0 0 10px #00B7FF,
        0 0 25px #00B7FF;

    animation:scanner 2.5s linear infinite;
}

@keyframes scanner{

    0%{
        top:0;
    }

    50%{
        top:100%;
    }

    100%{
        top:0;
    }

}

/* =========================================
   STATUS
========================================= */

#status{
    margin-top:20px;
    color:#65d6ff;
    font-size:16px;
    line-height:1.5;
}

/* =========================================
   BOTÕES
========================================= */

#capturar,
#continuar{

    margin-top:20px;
    padding:15px 35px;

    border:none;
    border-radius:40px;

    background:#00B7FF;
    color:white;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:0 0 20px #00B7FF55;

    transition:.3s;
}

#capturar:hover,
#continuar:hover{

    transform:translateY(-3px);

    box-shadow:0 0 30px #00B7FF;

}

#capturar:active,
#continuar:active{
    transform:scale(.97);
}

/* =========================================
   FOTO CAPTURADA
========================================= */

#foto{

    display:none;

    width:100%;
    max-width:350px;

    border-radius:20px;

    margin:20px auto 0;

    border:2px solid #00B7FF;

    box-shadow:0 0 20px #00B7FF55;
}

/* =========================================
   BOTÃO CONTINUAR
========================================= */

#continuar{

    display:block;

    margin:18px auto 30px;

    padding:15px 45px;

    background:linear-gradient(
        90deg,
        #008DFF,
        #00D4FF
    );

}

/* =========================================
   CANVAS
========================================= */

#canvas{
    display:none;
}

/* =========================================
   RESPONSIVIDADE
========================================= */

@media(max-width:500px){

    h1{
        font-size:25px;
    }

    .container{
        width:100%;
    }

    #capturar,
    #continuar{
        width:100%;
        font-size:14px;
    }

}

</style>
</head>

<body>

<div class="container">

    <h1>ESPELHO DO FUTURO</h1>

    <p class="subtitulo">
        Posicione seu rosto diante da câmera
        e prepare-se para descobrir seu futuro!
    </p>

    <!-- ÁREA DA CÂMERA -->

    <div class="camera-box">

        <video
            id="video"
            autoplay
            playsinline
            muted>
        </video>

        <div class="scanner"></div>

    </div>

    <!-- CANVAS PARA CAPTURAR A FOTO -->

    <canvas id="canvas"></canvas>

    <!-- STATUS -->

    <p id="status">
        🔍 Procurando câmera...
    </p>

    <!-- BOTÃO DE CAPTURA -->

    <button id="capturar" type="button">
        📸 TIRAR FOTO
    </button>

    <!-- FOTO CAPTURADA -->

    <img
        id="foto"
        alt="Foto capturada"
    >

    <!-- CONTINUAR COM OU SEM FOTO -->

    <button id="continuar" type="button">
        CONTINUAR SEM FOTO →
    </button>

</div>


<script>

/* =========================================
   ELEMENTOS DA PÁGINA
========================================= */

const video = document.getElementById("video");

const canvas = document.getElementById("canvas");

const foto = document.getElementById("foto");

const botao = document.getElementById("capturar");

const status = document.getElementById("status");

const continuar = document.getElementById("continuar");

let cameraStream = null;

// Cada participante começa uma nova experiência.
try { localStorage.removeItem("fotoRosto"); } catch (e) { console.warn("Armazenamento indisponível:", e); }


/* =========================================
   SISTEMA DE SONS
========================================= */

let audioCtx = null;

function contextoAudio(){

    if(!audioCtx){

        audioCtx = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    if(audioCtx.state === "suspended"){
        audioCtx.resume();
    }

    return audioCtx;

}


/* =========================================
   SOM DO OBTURADOR
========================================= */

function tocarSomObturador(){

    try{

        const ctx = contextoAudio();

        const agora = ctx.currentTime;

        criarRuidoCurto(
            ctx,
            agora,
            0.035,
            1800
        );

        criarRuidoCurto(
            ctx,
            agora+0.09,
            0.04,
            1400
        );

        const flash = ctx.createOscillator();

        const ganhoFlash = ctx.createGain();

        flash.type = "sine";

        flash.frequency.setValueAtTime(
            2200,
            agora
        );

        flash.frequency.exponentialRampToValueAtTime(
            600,
            agora+0.08
        );

        ganhoFlash.gain.setValueAtTime(
            0.0001,
            agora
        );

        ganhoFlash.gain.exponentialRampToValueAtTime(
            0.18,
            agora+0.005
        );

        ganhoFlash.gain.exponentialRampToValueAtTime(
            0.0001,
            agora+0.09
        );

        flash.connect(ganhoFlash);

        ganhoFlash.connect(ctx.destination);

        flash.start(agora);

        flash.stop(agora+0.1);

    }catch(erro){

        console.warn("Erro no som:",erro);

    }

}


/* =========================================
   CRIAR SOM DE CLIQUE
========================================= */

function criarRuidoCurto(
    ctx,
    quando,
    duracao,
    frequenciaFiltro
){

    const tamanhoBuffer = Math.floor(
        ctx.sampleRate * duracao
    );

    const buffer = ctx.createBuffer(
        1,
        tamanhoBuffer,
        ctx.sampleRate
    );

    const dados = buffer.getChannelData(0);

    for(let i=0;i<tamanhoBuffer;i++){

        dados[i] =
            (Math.random()*2-1) *
            (1-i/tamanhoBuffer);

    }

    const fonte = ctx.createBufferSource();

    fonte.buffer = buffer;

    const filtro = ctx.createBiquadFilter();

    filtro.type = "bandpass";

    filtro.frequency.value = frequenciaFiltro;

    filtro.Q.value = 1.2;

    const ganho = ctx.createGain();

    ganho.gain.setValueAtTime(
        0.6,
        quando
    );

    ganho.gain.exponentialRampToValueAtTime(
        0.001,
        quando+duracao
    );

    fonte.connect(filtro);

    filtro.connect(ganho);

    ganho.connect(ctx.destination);

    fonte.start(quando);

    fonte.stop(quando+duracao);

}


/* =========================================
   SOM DE CONFIRMAÇÃO
========================================= */

function tocarSomConfirmacao(){

    try{

        const ctx = contextoAudio();

        const agora = ctx.currentTime;

        const oscilador = ctx.createOscillator();

        const ganho = ctx.createGain();

        oscilador.type = "triangle";

        oscilador.frequency.setValueAtTime(
            500,
            agora
        );

        oscilador.frequency.exponentialRampToValueAtTime(
            900,
            agora+0.15
        );

        ganho.gain.setValueAtTime(
            0.0001,
            agora
        );

        ganho.gain.exponentialRampToValueAtTime(
            0.22,
            agora+0.01
        );

        ganho.gain.exponentialRampToValueAtTime(
            0.0001,
            agora+0.22
        );

        oscilador.connect(ganho);

        ganho.connect(ctx.destination);

        oscilador.start(agora);

        oscilador.stop(agora+0.25);

    }catch(erro){

        console.warn("Erro no som:",erro);

    }

}


/* =========================================
   SOM DE ERRO
========================================= */

function tocarSomErro(){

    try{

        const ctx = contextoAudio();

        const agora = ctx.currentTime;

        const oscilador = ctx.createOscillator();

        const ganho = ctx.createGain();

        oscilador.type = "square";

        oscilador.frequency.setValueAtTime(
            220,
            agora
        );

        oscilador.frequency.exponentialRampToValueAtTime(
            140,
            agora+0.2
        );

        ganho.gain.setValueAtTime(
            0.0001,
            agora
        );

        ganho.gain.exponentialRampToValueAtTime(
            0.15,
            agora+0.01
        );

        ganho.gain.exponentialRampToValueAtTime(
            0.0001,
            agora+0.25
        );

        oscilador.connect(ganho);

        ganho.connect(ctx.destination);

        oscilador.start(agora);

        oscilador.stop(agora+0.25);

    }catch(erro){

        console.warn("Erro no som:",erro);

    }

}


/* =========================================
   ABRIR A CÂMERA
========================================= */

async function abrirCamera(){

    try{

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            throw new Error(
                "Navegador sem suporte à câmera."
            );

        }

        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"user"
                },

                audio:false

            });

        video.srcObject = cameraStream;

        await video.play();

        status.innerHTML =
            "🟢 Câmera funcionando! Posicione seu rosto.";

        status.style.color = "#00FF88";

    }catch(error){

        console.error(
            "Erro ao abrir câmera:",
            error
        );

        status.innerHTML =
            "❌ Não foi possível acessar a câmera. Você pode continuar sem foto.";

        status.style.color = "#FF4444";

        botao.disabled = true;

        botao.style.opacity = ".5";

    }

}


/* INICIAR CÂMERA */

abrirCamera();


/* =========================================
   TIRAR FOTO
========================================= */

botao.addEventListener("click",function(){

    if(!video.videoWidth){

        tocarSomErro();

        alert(
            "A câmera ainda não está pronta. Aguarde ou continue sem foto."
        );

        return;

    }

    tocarSomObturador();

    canvas.width = video.videoWidth;

    canvas.height = video.videoHeight;

    const contexto = canvas.getContext("2d");

    // Espelhar a imagem para acompanhar o vídeo.

    contexto.translate(
        canvas.width,
        0
    );

    contexto.scale(-1,1);

    contexto.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    // Transformar a imagem em JPEG.

    const imagem = canvas.toDataURL(
        "image/jpeg",
        0.90
    );

    // Mostrar a foto na tela.

    foto.src = imagem;

    foto.style.display = "block";

    // Salvar a foto no navegador.

    try{

        localStorage.setItem(
            "fotoRosto",
            imagem
        );

    }catch(error){

        console.warn(
            "Não foi possível salvar a foto:",
            error
        );

    }

    // Atualizar o status.

    status.innerHTML =
        "✅ Foto capturada com sucesso!";

    status.style.color = "#00FF88";

    // Atualizar os botões.

    botao.innerHTML =
        "✅ FOTO CAPTURADA";

    continuar.innerHTML =
        "CONTINUAR →";

    tocarSomConfirmacao();

});


/* =========================================
   CONTINUAR COM OU SEM FOTO
========================================= */

continuar.addEventListener("click",function(){

    tocarSomConfirmacao();

    // A foto é opcional: o quiz também funciona sem ela.
    continuar.disabled = true;
    continuar.textContent = "ABRINDO O QUIZ...";

    /*
       IMPORTANTE:

       O arquivo do quiz precisa estar na
       mesma pasta e ter o nome:

       perguntas.html
    */

    window.location.href = "./perguntas.html";

});


/* =========================================
   ENCERRAR CÂMERA AO SAIR DA PÁGINA
========================================= */

window.addEventListener("pagehide",function(){

    if(cameraStream){

        cameraStream.getTracks().forEach(
            track => track.stop()
        );

    }

});

</script>

</body>
</html>
